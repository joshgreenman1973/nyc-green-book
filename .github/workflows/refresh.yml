name: Refresh directory

# Rebuilds once a week, Monday morning. Agency heads and divisions change on the
# scale of weeks, so a weekly refresh is current enough, and the Monday run has
# to rebuild anyway because the NYC.gov press-contacts page carries no update
# stamp. It used to check every four hours; that was dropped in September 2026 as
# more than the directory needs.
#
# A manual run (workflow_dispatch) can still use scripts/check_freshness.py to
# skip the rebuild when nothing has changed; tick "force" to rebuild regardless.
#
# The build fails loud on a short read, so a failed run is a real failure worth
# an email, not noise to suppress.

on:
  schedule:
    - cron: '0 11 * * 1'     # Mondays ~07:00 ET
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the city has published nothing new'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Has the city published anything new?
        id: check
        # The weekly run and a forced manual run skip the check entirely.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced run."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/check_freshness.py || true
          fi

      - name: Test the matching rules
        if: steps.check.outputs.changed == 'true'
        run: python3 scripts/test_matching.py

      - name: Rebuild
        if: steps.check.outputs.changed == 'true'
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python3 scripts/build.py

      - name: Export the administration contact list
        if: steps.check.outputs.changed == 'true'
        run: python3 scripts/export_admin.py

      - name: Commit if the data moved
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "Josh Greenman"
          git config user.email "josh.greenman@gmail.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sources restamped but the directory is unchanged."
          else
            git commit -m "Refresh directory $(date -u +%Y-%m-%d)"
            git push
          fi
