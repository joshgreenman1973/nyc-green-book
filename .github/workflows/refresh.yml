name: Refresh directory

# The Green Book dataset moves irregularly — the city refreshed it twice in the
# week this was built — and the governance dataset is nominally annual but gets
# off-cycle updates that are themselves a signal. Weekly keeps both current
# without hammering anyone.
#
# The build fails loud on a short read, so a failed run is a real failure worth
# an email, not noise to suppress.

on:
  schedule:
    - cron: '0 11 * * 1'    # Mondays, ~07:00 ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Test the matching rules
        run: python3 scripts/test_matching.py

      - name: Rebuild
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python3 scripts/build.py

      - name: Commit if the data moved
        run: |
          git config user.name "Josh Greenman"
          git config user.email "josh.greenman@gmail.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No change in the city's data."
          else
            git commit -m "Refresh directory $(date -u +%Y-%m-%d)"
            git push
          fi
